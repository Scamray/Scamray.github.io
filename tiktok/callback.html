<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Scam Ray · TikTok connected</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#111;margin:0;padding:32px 16px;max-width:560px;margin:auto}
h1{font-size:22px} .b{color:#ff3b3b}
code{display:block;word-break:break-all;background:#f3f4f6;border-radius:10px;padding:14px;font-size:15px;margin:12px 0}
button{background:#111;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700}
.err{color:#b71c1c}
</style></head><body>
<p><b>SCAM <span class="b">RAY</span></b></p>
<div id="out"></div>
<script>
const q = new URLSearchParams(location.search), code = q.get("code"), err = q.get("error");
const out = document.getElementById("out");
if (code) {
  out.innerHTML = '<h1>TikTok approved the connection</h1><p>Copy this one-time code and paste it into the GitHub secret <b>TIKTOK_AUTH_CODE</b> within a few minutes. Don\'t share it in chat.</p><code id="c"></code><button id="cp">Copy code</button>';
  document.getElementById("c").textContent = code;
  document.getElementById("cp").onclick = () => navigator.clipboard.writeText(code).then(() => document.getElementById("cp").textContent = "Copied");
} else if (err) {
  out.innerHTML = '<h1 class="err">TikTok didn\'t connect</h1><p id="e"></p>';
  document.getElementById("e").textContent = err + ": " + (q.get("error_description") || "");
} else {
  out.innerHTML = "<h1>Nothing to see here</h1><p>This page finishes connecting Scam Ray's own TikTok account.</p>";
}
</script>
</body></html>
