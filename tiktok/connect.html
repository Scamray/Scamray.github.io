<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Scam Ray · Connect TikTok</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#111;padding:32px 16px;max-width:560px;margin:auto}
h1{font-size:22px} .b{color:#ff3b3b}
input{width:100%;box-sizing:border-box;font-size:16px;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:8px 0 14px}
button{background:#111;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700}
</style></head><body>
<p><b>SCAM <span class="b">RAY</span></b></p>
<h1>Connect the Scam Ray TikTok account</h1>
<p>Paste the Sandbox <b>Client key</b> from the TikTok developer app (not the secret), then tap Connect and approve as @thescamray.</p>
<input id="k" placeholder="Client key" autocomplete="off" autocapitalize="off" spellcheck="false">
<button id="go">Connect</button>
<script>
document.getElementById("go").onclick = () => {
  const key = document.getElementById("k").value.trim(); if (!key) return;
  const p = new URLSearchParams({ client_key: key, response_type: "code", scope: "user.info.basic,video.upload,video.publish",
    redirect_uri: "https://scamray.github.io/tiktok/callback.html", state: "scamray" });
  location.href = "https://www.tiktok.com/v2/auth/authorize/?" + p;
};
</script>
</body></html>
